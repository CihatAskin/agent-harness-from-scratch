[project]
name = "agent-harness-from-scratch"
version = "0.1.0"
description = "A minimal LLM agent harness, built step by step to learn how agents work."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Cihat Aşkın" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
